name: Validate and preview Firebase pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: firebase-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check deployment secret is configured
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SANSKRITICHOKHANI_AI }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Add repository secret FIREBASE_SERVICE_ACCOUNT_SANSKRITICHOKHANI_AI. See .github/DEPLOYMENT_SETUP.md."
            exit 1
          fi
      - name: Deploy preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SANSKRITICHOKHANI_AI }}
          projectId: sanskritichokhani-ai
          expires: 7d
